name: filesystem-dev
version: 2
title: Filesystem Dev
reviewed: "2026-07-10"
reviewed_by: tenuo-packs
description: >
  Starter governance for local Claude Code development: repository-scoped file
  reads/writes/search, a small POSIX shell allowlist, and domain-scoped WebFetch.
pinned:
  name: claude-code-native-tools
  version: "2026.07"
  tool_list_hash: native
params:
  - name: sandbox
    prompt: Which directory may the agent read and edit?
    example: . (this project) or ./src
    default: .
    required: true
  - name: commands
    prompt: Which shell commands may the agent run?
    example: ls,pwd,pytest
    default: ls,pwd
    required: true
  - name: web_domain
    prompt: Which web domain may WebFetch call?
    example: api.github.com or *.githubusercontent.com
    default: api.github.com
    required: true
summary:
  tools: 10
  allowed: 7
  gated: 0
  denied: 3
assumptions:
  - Bash runs only the listed commands; chaining, pipes and subshells are denied. File access goes through the path-checked tools.
  - Tenuo's own files (.state, tenuo.yaml, .mcp.json, .claude/settings*.json) are never readable or writable through path tools.
  - Path-scoped tools resolve symlinks before authorization.
  - Add project-specific domains deliberately; WebFetch keeps SSRF hygiene enabled.

