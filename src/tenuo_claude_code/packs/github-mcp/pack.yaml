name: github-mcp
version: 4
title: GitHub MCP
reviewed: "2026-06-28"
reviewed_by: tenuo-packs
description: >
  Starter governance for GitHub MCP servers: repo-scoped reads and ordinary
  collaboration, approval-gated merge/push, and explicit denial for repository
  deletion/fork/high-blast-radius operations.
pinned:
  name: github-mcp-server
  version: "2.0.2"
  tool_list_hash: v2.0.2
params:
  - name: owner
    prompt: Which GitHub account or organization owns the repos?
    example: myorg
    required: true
  - name: repos
    prompt: Which of its repositories may agents touch? (name only, glob allowed)
    example: service-* or payments-api
    required: true
  - name: approver
    prompt: Who approves merges and pushes?
    example: key id, email, or any-human
    required: true
summary:
  tools: 20
  allowed: 12
  gated: 6
  denied: 2
assumptions:
  - GitHub MCP tool names match github-mcp-server v2.0.2.
  - Governed tools take owner and repo (name only) as separate arguments, as in github-mcp-server.
  - Approval gates require Tenuo Cloud; local mode denies gated calls fail-closed.

