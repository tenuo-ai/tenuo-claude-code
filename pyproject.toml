[project]
name = "tenuo-claude-code"
version = "0.6.4"
description = "Tenuo governance for Claude Code — warrants, hooks, MCP proxy, and Cloud lifecycle"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tenuo Contributors" }]
keywords = ["claude-code", "governance", "security", "mcp", "agents", "warrants"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tenuo>=0.3.0,<0.4",
    "mcp>=1.0,<2",
    "PyYAML>=6.0",
    "certifi>=2024.0",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://tenuo.ai"
Repository = "https://github.com/tenuo-ai/claude-governance"
Documentation = "https://github.com/tenuo-ai/claude-governance#readme"
Issues = "https://github.com/tenuo-ai/claude-governance/issues"

[project.scripts]
tenuo-claude = "tenuo_claude_code.cli:main"
tenuo-admin = "tenuo_claude_code.admin:main"
# Long-form aliases (match PyPI package name)
tenuo-claude-code = "tenuo_claude_code.cli:main"
tenuo-claude-admin = "tenuo_claude_code.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenuo_claude_code"]

[tool.hatch.build.targets.sdist]
include = [
    "src/tenuo_claude_code",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "templates",
    "docs",
    "examples",
    "tests",
    "demo/README.md",
    "demo/.claude/agents",
    "demo/.mcp.json",
    "demo/fake-secrets.env",
    "demo/ops_server.py",
    "demo/sandbox",
    "demo/tenuo.yaml",
    "demo/tenuo_demo.py",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Unit tests cover the pure decision logic (routing, constraints, approval
# encoding, subagent attenuation, secret file modes) — no Docker, no authorizer,
# no network. Run: `uv run --with pytest pytest`. The live enforcement self-test
# is `tenuo-claude verify` (needs the authorizer container).
