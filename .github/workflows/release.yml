name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # trusted publishing (OIDC) when PYPI_TOKEN is unset
  attestations: write  # SLSA build provenance for the published artifacts

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Validate release tag and package versions
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          uv run --frozen python - <<'PYTHON'
          import os, tomllib
          from pathlib import Path
          from tenuo_claude_code import __version__
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version == __version__, "Package versions disagree"
          assert os.environ["RELEASE_REF"] == f"refs/tags/v{version}", "Publish requires the matching release tag"
          PYTHON

      - name: Regression tests
        run: uv run --frozen --with pytest pytest

      - name: Build
        run: uv build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "${PYPI_TOKEN}" ]; then
            echo "Publishing with PYPI_TOKEN secret..."
            UV_PUBLISH_TOKEN="${PYPI_TOKEN}" uv publish --check-url https://pypi.org/simple/
          else
            echo "No PYPI_TOKEN — using trusted publishing (OIDC)."
            echo "PyPI must list a pending publisher for:"
            echo "  owner=tenuo-ai  repo=tenuo-claude-code  workflow=release.yml"
            uv publish --trusted-publishing always --check-url https://pypi.org/simple/
          fi
