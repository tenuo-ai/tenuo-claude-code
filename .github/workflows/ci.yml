name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-versions:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Unit tests
        run: uv run --with pytest pytest

  build-and-test:
    name: Build & smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Unit tests (pure logic — no Docker/authorizer)
        run: uv run --with pytest pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Verify package metadata
        run: |
          expected=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          actual=$(uv run python -c "from tenuo_claude_code import __version__; print(__version__)")
          test "$expected" = "$actual"

      - name: check passes without repo launcher (PyPI layout)
        # Preflight needs a backend (Docker or the native binary). Linux runners
        # ship Docker for free; the macOS backend lifecycle is covered by the
        # enforcement job, which installs the native authorizer.
        if: runner.os == 'Linux'
        run: |
          proj=$(mktemp -d)
          cp templates/tenuo.yaml.example "$proj/tenuo.yaml"
          mkdir -p "$proj/workspace"
          TENUO_PROJECT_DIR="$proj" uv run tenuo-claude check

      - name: Smoke test init in temp project
        run: |
          tmp=$(mktemp -d)
          cp templates/tenuo.yaml.example "$tmp/tenuo.yaml"
          mkdir -p "$tmp/workspace"
          touch "$tmp/workspace/notes.txt"
          TENUO_PROJECT_DIR="$tmp" uv run tenuo-claude init
          state=$(TENUO_PROJECT_DIR="$tmp" uv run tenuo-claude state-dir)
          test -f "$state/warrant.b64"
          test -f "$state/gateway.yaml"
          test ! -e "$tmp/.state"
          test -f "$tmp/.claude/settings.json"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.6.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  enforcement:
    name: Enforcement self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Proves the leash end to end: mints a local warrant, starts the native
    # tenuo-authorizer binary (prebuilt release, else built from the crate), and
    # runs `verify`. No Docker required.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Install tenuo-authorizer (managed install)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run tenuo-claude install-authorizer
          echo "$HOME/.tenuo/bin" >> "$GITHUB_PATH"

      - name: bootstrap from empty directory (golden path)
        run: |
          proj="$RUNNER_TEMP/governed"
          mkdir -p "$proj"
          TENUO_PROJECT_DIR="$proj" uv run tenuo-claude bootstrap
          test -f "$proj/tenuo.yaml"
          test -f "$(TENUO_PROJECT_DIR="$proj" uv run tenuo-claude state-dir)/warrant.b64"
          test -f "$proj/.claude/settings.json"
          echo "TENUO_PROJECT_DIR=$proj" >> "$GITHUB_ENV"

      - name: verify (policy self-test against the live authorizer)
        run: uv run tenuo-claude verify

      - name: Authorizer logs on failure
        if: failure()
        run: |
          echo "=== authorizer.log ==="
          cat "$(uv run tenuo-claude state-dir)/authorizer.log" 2>/dev/null || true

      - name: down (stop authorizer)
        if: always()
        run: uv run tenuo-claude down || true

  enforcement-wsl:
    name: Enforcement self-test (Windows / WSL)
    runs-on: windows-latest
    # The supported Windows path is WSL (see README). This runs the full
    # lifecycle — sync, unit tests, bootstrap, live verify — inside a real WSL
    # Ubuntu distro, mirroring how a Windows developer actually uses the tool.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up WSL (Ubuntu)
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl ca-certificates build-essential pkg-config libssl-dev

      - name: Copy checkout into the WSL filesystem
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          # wsl-bash doesn't reliably export GITHUB_WORKSPACE; fall back to the
          # working directory (setup-wsl runs steps in the checkout). Build/run on
          # the ext4 home, not the slow/noexec /mnt mount, but exercise the same tree.
          ws="${GITHUB_WORKSPACE:-}"
          if [ -n "$ws" ]; then ws="$(wslpath -u "$ws")"; else ws="$PWD"; fi
          ls -la "$ws"
          mkdir -p "$HOME/repo"
          cp -r "$ws/." "$HOME/repo/"
          test -f "$HOME/repo/pyproject.toml"

      - name: Install uv (in WSL)
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync + unit tests (in WSL)
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME/repo"
          uv sync --frozen
          uv run --with pytest pytest

      - name: Install Rust (in WSL)
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable

      - name: bootstrap + verify against the live authorizer (in WSL)
        shell: wsl-bash {0}
        env:
          GH_TOKEN: ${{ github.token }}
          # Windows variables require explicit forwarding into WSL.
          WSLENV: GH_TOKEN
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$HOME/.tenuo/bin:$PATH"
          cd "$HOME/repo"
          uv run tenuo-claude install-authorizer
          proj="$HOME/governed"
          mkdir -p "$proj"
          TENUO_PROJECT_DIR="$proj" uv run tenuo-claude bootstrap
          test -f "$proj/tenuo.yaml"
          test -f "$(TENUO_PROJECT_DIR="$proj" uv run tenuo-claude state-dir)/warrant.b64"
          test -f "$proj/.claude/settings.json"
          # WSL networking can lag behind the "Authorizer up" message, so the
          # first verify probe occasionally times out. Wait for /health to answer
          # before verifying to keep this job from flaking.
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9090/health >/dev/null 2>&1 && break
            sleep 1
          done
          TENUO_PROJECT_DIR="$proj" uv run tenuo-claude verify

      - name: Authorizer logs on failure (in WSL)
        if: failure()
        shell: wsl-bash {0}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME/repo"
          cat "$(TENUO_PROJECT_DIR="$HOME/governed" uv run tenuo-claude state-dir)/authorizer.log" 2>/dev/null || true

      - name: down (in WSL)
        if: always()
        shell: wsl-bash {0}
        run: |
          export PATH="$HOME/.local/bin:$HOME/.tenuo/bin:$PATH"
          cd "$HOME/repo"
          TENUO_PROJECT_DIR="$HOME/governed" uv run tenuo-claude down || true
